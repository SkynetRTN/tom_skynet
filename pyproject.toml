[project]
name = "tom-skynet"
version = "0.1.0"
description = "Skynet Robotic Telescope Network facility for the TOM Toolkit"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# tomtoolkit 3.1 supports Python <3.14; AEONlib needs >=3.12.
requires-python = ">=3.12,<3.14"
dependencies = [
    "tomtoolkit>=3.1,<4",
]

[project.urls]
Source = "https://github.com/SkynetRTN/tom_skynet"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tom_skynet"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
force-exclude = true
