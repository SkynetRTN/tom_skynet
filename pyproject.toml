[project]
name = "tom-skynet"
version = "0.2.0"
description = "Skynet Robotic Telescope Network facility for the TOM Toolkit"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# tomtoolkit 3.1 supports Python <3.14; AEONlib needs >=3.12.
requires-python = ">=3.12,<3.14"
dependencies = [
    "tomtoolkit>=3.1,<4",
    # AEONlib's Skynet facility isn't released yet: pinned to the
    # SkynetRTN/AEONlib fork's `skynet` branch until it is.
    "aeonlib @ git+https://github.com/SkynetRTN/AEONlib@168eeab1d7cd6efced9c929eef2f9fc9d4b779fd",
]

[project.urls]
Source = "https://github.com/SkynetRTN/tom_skynet"

[dependency-groups]
dev = [
    # Type stubs for `ty`: Django adds `objects` and `_meta` to models at runtime.
    "django-stubs>=5.2,<5.3",
    "pytest>=8",
    "pytest-django>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/tom_skynet"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/tom_skynet/migrations"]
force-exclude = true
